[package]
name = "clockify-agent"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "clockify"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1.8"
ureq = { version = "3.4.2", features = ["json"] }

[dev-dependencies]
mockito = "1.7.2"
